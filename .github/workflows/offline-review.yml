name: Offline Python checks
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  offline-replication-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install open-source Python dependencies
        run: python -m pip install -r requirements-full.txt
      - name: Run package self tests
        run: python -m unittest discover -s tests -v
      - name: Re-render six plots from expected summary tables (visual smoke only)
        run: python src/replot_all_figures.py --references references --out "${{ runner.temp }}/six_plot_smoke"
      - name: Validate required metadata and package files (not a peer review)
        run: python scripts/check_release_gate.py --scope private
